echo "Loading demo settings..."

ds_autodelete 0 //0 = never delete demo files
ds_dir demos //directory will be /tf/demos/...
ds_enable 0 //0 = manual, 1 = auto record valve competitive, 2 = auto record all matches, 3 = auto record mp_tournament matches (casual, community, etc.)
ds_kill_delay 15 //max time in seconds between kills for streak to be considered a streak (default 15)
ds_log 1 //log demo events to separate .txt
ds_min_streak 4 //minimum killstreak to be bookmarked (default 4)
ds_notify 2 //text output for demo events, 0 = to console, 1 = to console and chat, 2 = to console and HUD
ds_prefix dem_ //all demo files will start with prefix "dem_"
ds_screens 1 //1 = take separate screenshot of match scoreboard
ds_sound 1 //1 = demo start stop sounds enabled (good idea to disable if recording every match)

echo "Demo settings complete"
echo " "
