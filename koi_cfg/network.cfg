echo "Loading network settings..."

//Server tickrates
//TF2 is designed to only use 66 tick servers unless you do some weird voodoo magic
//Because of this, it is advised to use the following 2 network settings:
cl_cmdrate 66
cl_updaterate 66
//As expected, if for whatever weird reason you play on 128 / 132 tick servers, use the following:
//cl_cmdrate 128 / 132
//cl_updaterate 128 / 132

//Interp settings
//ASSUMING YOU PLAY ON 66 TICK SERVERS (see above for details)
cl_interp 0.0304
cl_interp_ratio 2
//Note 1: Many servers restrict cl_interp_ratio to be 1. This will not impact the above settings since
//        cl_interp 0.0304 will still override ratio 1's 0.01515151515 value anyway. See below for ratio details:
//        - cl_interp_ratio 1 / cl_updaterate 66 = 0.01515151515 interp at the lowest (cl_interp 0.0304 will override this which is good)
//        - cl_interp_ratio 2 / cl_updaterate 66 = 0.0303030303 interp at the lowest
//Note 2: Setting cl_interp to 0.0152 for any reason, even for projectile classes in competitive environments, is NOT
//        worth the added network unstability/dropped packets. It would be advised to simply stick with cl_interp 0.0304
//        regardless of what cl_interp_ratio is set to.
//Note 3: Setting cl_interp to 0 defaults the value to 0.007, which is not stable - you will drop packets.

rate 131072 //Max bytes/sec the host can receive data
//Recommended rate values:
//Bandwidth 762Kbps = rate 80000 (default / recommended)
//Bandwidth 1.0Mbps = rate 131072
//Bandwidth 1.5Mbps = rate 196608 (rate used for server communication)

cl_allowdownload 1
cl_allowupload 1
cl_lagcompensation 1
cl_localnetworkbackdoor 0
cl_pred_optimize 2
cl_smooth 1 //0 provides little to no benefit
cl_smoothtime 0.1 //0.05
host_limitlocal 0 //0 = apply cl_cmdrate and cl_updaterate to loopback connection
hud_escort_interp 0.1
net_chokeloop 0 //1 provides small bandwidth boost
net_compressvoice 0
net_graphsolid 1
net_maxcleartime 0 //4.0
net_maxfilesize 64
net_maxpacketdrop 0
net_queued_packet_thread 1
net_splitpacket_maxrate 131072
sdr_spew_level 0

tf_mm_custom_ping_enabled 1
tf_mm_custom_ping 51 //50 (always subtracts 1)
tf_mm_dashboard_spew_enabled 0
tf_mm_debug_level 0
tf_mm_partyclient_debug 0
//tf_mm_servermode 1 //0 = lobby not in mm mode, 1 = lobby mm mode
//tf_mm_strict 2 //0 = show in browser and allow adhoc, 1 = show in browser and only allow gc mm connects, 2 = hide from browser and allow adhoc

cl_timeout 150 //default is 30 seconds before disconnect, this boosts to 2 min 30 seconds

//Pre-set some listen server values on game launch, some being necessary and some duplicate for safety
//If changing any of the below commands, make sure to also check and change listenserver.cfg

sv_lan 0 //0 = allow internet connections, 1 = LAN connections only
hide_server 0 //0 = do not hide server, 1 = hide (should be kept 0 even for LAN servers)
sv_use_steam_networking 1 //1 = allow players to connect to server from internet, 0 = LAN only
echo "Listen server set to utilize steam networking"

maxplayers 24 //must be set here and not in listenserver.cfg
sv_pure -1 //must be pre-set here for change to take effect on first map launch
sv_region -1 //safety
sv_allow_point_servercommand always //always = ensure tr_walkway and other custom maps work
sv_maxrate 50000
sv_minrate 7500
sv_maxupdaterate 66
sv_minupdaterate 20
sv_maxcmdrate 66
sv_mincmdrate 0
tf_allow_server_hibernation 0

//For tr_walkway_rc2:
//Use command "map workshop/606778917" or if already in a server use "changelevel workshop/606778917"
//Or alternatively just download the map manually and place the .bsp inside \tf\maps\ folder

echo "Network settings complete"
echo " "
