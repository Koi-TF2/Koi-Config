//See koi_cfg/network.cfg for changing specific listen server values such as maxplayers

hide_server 0 //0 = do not hide server, 1 = hide (should be kept 0 even for LAN servers)
sv_allow_server_adverisement_to_master_server 1 //1 = allow server connection to GC, 0 = no connection to GC (acts similarly to sv_lan 1 without needing LAN server)
sv_friends_only 0 //0 = anyone can join the server, 1 = only steam friends can join
sv_lan 0 //0 = allow internet connections, 1 = LAN connections only
sv_use_steam_networking 1 //1 = allow players to connect to server from internet, 0 = LAN only
tf_mm_servermode 0 //0 = disable lobby-based mm, 1 = enable lobby-based mm, (default 0)
tf_mm_strict 0 //0 = show in browser and allow adhoc, 1 = show in browser and only allow gc mm connects, 2 = hide from browser and allow adhoc

//For tr_walkway_rc2:
//Use command "map workshop/606778917" or if already in a server use "changelevel workshop/606778917"
//Or alternatively just download the map manually and place the .bsp inside \tf\maps\ folder

//For tr_karma_final:
//Use command "map workshop/601600702" or if already in a server use "changelevel workshop/601600702"

//Important server configs
hostname "Listen Server" //will always override the Create Server button's set name
sv_password "" //set a password if you only want specific people to get into your listen server
sv_tags "koi" //comma separated list of searchable tags within internet server browser
sv_region -1 //-1 = do not limit region

//Server game and misc settings
mp_allowspectators 1
mp_autoteambalance 0
mp_forcecamera 0
mp_idledealmethod 1
mp_idlemaxtime 999
sv_allow_wait_command 1
sv_allowdownload 1
sv_allowupload 1
sv_voiceenable 1
sv_alltalk 1
sv_cheats 0
log off
sv_logbans 0
sv_logecho 0
sv_logfile 0
sv_pausable 0
sv_pure -1
sv_pure_kick_clients 0
tf_damage_disablespread 1
tf_fall_damage_disablespread 1
tf_use_fixed_weaponspreads 1
tf_weapon_criticals 0
tf_weapon_criticals_melee 0
tf_allow_server_hibernation 0
sv_allow_point_servercommand always

//Voting settings
sv_vote_creation_timer 10
sv_vote_failure_timer 10
sv_vote_failure_timer_mvm 10
sv_vote_holder_may_vote_no 0
sv_vote_allow_spectators 1
sv_vote_bots_allowed 0
sv_vote_issue_autobalance_allowed 1
sv_vote_issue_autobalance_cooldown 10
sv_vote_issue_changelevel_allowed 1
sv_vote_issue_changelevel_allowed_mvm 1
sv_vote_issue_classlimits_allowed 0
sv_vote_issue_classlimits_allowed_mvm 0
sv_vote_issue_extendlevel_allowed 1
sv_vote_issue_extendlevel_quorum 0.6
sv_vote_issue_kick_allowed 1
sv_vote_issue_kick_allowed_mvm 1
sv_vote_issue_kick_min_connect_time_mvm 300
sv_vote_issue_kick_namelock_duration 120
sv_vote_issue_kick_spectators_mvm 1
sv_vote_issue_mvm_challenge_allowed 1
sv_vote_issue_nextlevel_allowed 1
sv_vote_issue_nextlevel_allowextend 1
sv_vote_issue_nextlevel_choicesmode 0
sv_vote_issue_nextlevel_prevent_change 1
sv_vote_issue_restart_game_allowed 1
sv_vote_issue_restart_game_allowed_mvm 1
sv_vote_issue_restart_game_cooldown 10
sv_vote_issue_scramble_teams_allowed 1
sv_vote_issue_scramble_teams_cooldown 10
sv_vote_kick_ban_duration 20
sv_vote_late_join_cooldown 10
sv_vote_late_join_time 10
sv_vote_quorum_ratio 0.6
sv_vote_timer_allow_early_finish 1
sv_vote_timer_duration 15
